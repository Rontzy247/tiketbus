name: Compile C++ on Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up the Developer Command Prompt for MSVC (cl.exe)
    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # 3. Compile a single C++ script or source file
    - name: Compile C++ Script
      run: |
        cl.exe /EHsc main.cpp /fe:my_program.exe

    # 4. Upload the compiled .exe file as a workflow artifact
    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: windows-binary
        path: my_program.exe
